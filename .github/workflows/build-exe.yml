name: Build Windows exe

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name MassLab --exclude-module tkinter main.py
      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MassLab\MassLab.exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "MassLab.exe exited with code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: MassLab-windows
          path: dist/MassLab
